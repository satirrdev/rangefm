name: Android CI

on:
  push:
    branches: [main, master]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Determine Gradle file
        id: gradle_file
        run: |
          if [ -f app/build.gradle.kts ]; then
            echo "gradle_file=app/build.gradle.kts" >> $GITHUB_OUTPUT
          elif [ -f app/build.gradle ]; then
            echo "gradle_file=app/build.gradle" >> $GITHUB_OUTPUT
          else
            echo "gradle_file=build.gradle" >> $GITHUB_OUTPUT
          fi

      - name: Extract applicationId and versionName
        id: meta
        run: |
          GRADLE="${{ steps.gradle_file.outputs.gradle_file }}"
          APP_ID=""
          VERSION=""

          # Extract applicationId (handles both literal and project.property("ID") references)
          if [ -f "$GRADLE" ]; then
            APP_ID=$(grep -E 'applicationId[[:space:]]*(=)?' "$GRADLE" | head -1 | \
              sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/')
            # Fallback: if extracted value looks like a property reference, read from gradle.properties
            if echo "$APP_ID" | grep -qE '^[A-Z][A-Z0-9_]*$'; then
              PROP_NAME=$(echo "$APP_ID" | tr -d '"')
              PROP_VAL=$(grep -E "^\s*${PROP_NAME}\s*=" gradle.properties | head -1 | cut -d= -f2- | tr -d ' "')
              [ -n "$PROP_VAL" ] && APP_ID="$PROP_VAL"
            fi
          fi

          # Fallback default if not found
          [ -z "$APP_ID" ] && APP_ID="com.example.app"

          # Extract versionName (handles both literal and project.property("VERSION") references)
          if [ -f "$GRADLE" ]; then
            VERSION=$(grep -E 'versionName[[:space:]]*(=)?' "$GRADLE" | head -1 | \
              sed -E 's/.*["'"'"']([^"'"'"']+)["'"'"'].*/\1/')
            # Fallback: if extracted value looks like a property reference, read from gradle.properties
            if echo "$VERSION" | grep -qE '^[A-Z][A-Z0-9_]*$'; then
              PROP_NAME=$(echo "$VERSION" | tr -d '"')
              PROP_VAL=$(grep -E "^\s*${PROP_NAME}\s*=" gradle.properties | head -1 | cut -d= -f2- | tr -d ' "')
              [ -n "$PROP_VAL" ] && VERSION="$PROP_VAL"
            fi
          fi

          # Fallback default if not found
          [ -z "$VERSION" ] && VERSION="0.0.1"

          echo "app_id=$APP_ID" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename APKs
        run: |
          PKG="${{ steps.meta.outputs.app_id }}"
          VER="${{ steps.meta.outputs.version }}"

          APK_DIR="app/build/outputs/apk"
          FLAVORS=$(ls -d "$APK_DIR"/*/debug 2>/dev/null || true)

          mkdir -p ./renamed-apks

          # Find all debug APKs
          APKS=$(find "$APK_DIR" -name "*.apk" -path "*/debug/*" 2>/dev/null | sort)

          if [ -z "$APKS" ]; then
            echo "No debug APKs found, checking default location..."
            APKS=$(find "$APK_DIR" -name "*-debug.apk" 2>/dev/null | sort)
          fi

          for apk in $APKS; do
            # Get flavor: strip prefix to get "flavor/debug/filename", then take first component
            relpath="${apk#$APK_DIR/}"
            flavor=$(echo "$relpath" | cut -d/ -f1)

            # Build target name
            if [ "$flavor" != "debug" ] && [ -n "$flavor" ]; then
              target="${PKG}-${VER}-${flavor}-debug.apk"
            else
              target="${PKG}-${VER}-debug.apk"
            fi

            # Avoid collisions: if target exists, append flavor counter
            count=1
            while [ -f "./renamed-apks/$target" ]; do
              target="${PKG}-${VER}-${flavor}-debug-${count}.apk"
              count=$((count + 1))
            done

            echo "Renaming $apk -> renamed-apks/$target"
            cp "$apk" "./renamed-apks/$target"
          done

      - name: Upload renamed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app_id }}-${{ steps.meta.outputs.version }}-debug
          path: ./renamed-apks/*.apk
          retention-days: 7